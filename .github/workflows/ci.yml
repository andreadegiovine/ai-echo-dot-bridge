name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Commit di echo-dot-assist (hassmic) con cui il bridge è provato. Aggiornalo per provare una versione nuova.
  HASSMIC_REPO: https://github.com/Gamer92000/echo-dot-assist.git
  HASSMIC_REF: d71209987fdacc152c49bb40fbc0c83c9ee03c7e

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pacchetti di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libopus-dev zlib1g-dev espeak-ng

      - name: Cache del simulatore hassmic
        id: cache-hassmic
        uses: actions/cache@v4
        with:
          path: hassmic-host
          key: hassmic-host-${{ env.HASSMIC_REF }}-ubuntu-24.04

      - name: Compila il simulatore hassmic (build/hassmic-host)
        if: steps.cache-hassmic.outputs.cache-hit != 'true'
        run: |
          git init upstream && cd upstream
          git remote add origin "$HASSMIC_REPO"
          git fetch --depth 1 origin "$HASSMIC_REF"
          git checkout --quiet FETCH_HEAD
          make -j"$(nproc)" build/hassmic-host
          cp build/hassmic-host ../hassmic-host

      - name: Ambiente Python
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Controllo sintassi
        run: |
          .venv/bin/python -m compileall -q echobridge selftest.py tests
          bash -n install.sh tests/run_test.sh tests/ci.sh
          set -a; . ./echo-bridge.env; set +a; .venv/bin/python -c "import echobridge.server, echobridge.esphome_echo, echobridge.wyoming_echo"

      - name: Test end-to-end (modalità Wyoming)
        run: bash tests/ci.sh "$PWD/hassmic-host" "$PWD/.venv"

      - name: Test end-to-end (modalità ESPHome, MCP, arbitraggio)
        run: |
          espeak-ng -v it -s 150 -w voce.wav "Alexa, accendi la luce del soggiorno e dimmi che tempo fa domani"
          .venv/bin/python tests/esphome_e2e.py "$PWD/hassmic-host" "$PWD/voce.wav"
